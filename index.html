<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha Carioca</title>
    <link rel="stylesheet" href="styles.css ">
</head>

<body>
    <h1>🐍 Jogo da Cobrinha Carioca 🐍</h1>

    <div class="score-container">
        <div>Pontuação: <span id="score">0</span></div>
        <div>Recorde: <span id="high-score">0</span></div>
    </div>

    <div class="game-container">
        <canvas id="game-board" width="400" height="400"></canvas>
        <div id="game-over">
            <h2>Game Over, Mermão!</h2>
            <p>Sua pontuação: <span id="final-score">0</span></p>
            <button id="restart-button">Tentar Novamente</button>
        </div>
    </div>

    <div class="controls">
        <p>Use as setas ← ↑ → ↓ ou WASD para controlar a cobrinha</p>
        <p>Pressione Espaço para pausar/continuar</p>
        <button id="start-button">Iniciar Jogo</button>
    </div>

</body>
<script src="./scrpts.js"></script>

</html>
